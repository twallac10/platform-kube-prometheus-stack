# TIER-ONLY (prd). Never promoted: replicas, resources, retention, hostnames, enforcement mode.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  values:
    prometheus:
      prometheusSpec:
        replicas: 1
        retention: 24h
        retentionSize: 3GiB
        resources:
          requests:
            cpu: 100m
            memory: 400Mi
          limits:
            memory: 800Mi
    grafana:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
    prometheusOperator:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

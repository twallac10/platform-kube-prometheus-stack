# PROMOTABLE. A promotion copies this file unchanged from tier N-1 to tier N.
# Only the chart digest, image tags and settings shared by every tier go here.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
  annotations:
    platform.twallac10.io/chart-version: "93.0.0"
spec:
  ref:
    digest: "sha256:b0ec2f37f2f280bd7745ecc561a8ce7ccfbe1ea9d3e961c9fff636f1267149af" # set by `task charts:seed` / mirror.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  values:
    fullnameOverride: kps
    alertmanager:
      enabled: false
    nodeExporter:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        alertmanager: false
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        nodeExporterAlerting: false
        nodeExporterRecording: false
        general: false
    prometheusOperator:
      image:
        tag: v0.95.1
      prometheusConfigReloader:
        image:
          tag: v0.95.1
      admissionWebhooks:
        patch:
          image:
            tag: 1.11.1
    prometheus:
      prometheusSpec:
        image:
          tag: v3.16.0-distroless
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
    kube-state-metrics:
      image:
        tag: v2.20.0
    grafana:
      fullnameOverride: grafana
      image:
        tag: 13.3.0-distroless
      persistence:
        enabled: false
      sidecar:
        image:
          tag: 2.14.3
      testFramework:
        enabled: true
        image:
          tag: "1.14.0"
